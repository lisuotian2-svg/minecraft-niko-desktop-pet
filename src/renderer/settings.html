<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Niko Pet 3D 设置</title>
  </head>
  <body>
    <main class="settings">
      <header>
        <h1>Niko Pet 3D</h1>
        <span id="version">版本</span>
      </header>
      <label class="control" for="size">
        <span>角色大小</span>
        <output id="size-value" for="size">220 px</output>
      </label>
      <input id="size" type="range" min="80" max="500" step="10" value="220" />
      <label class="control" for="volume">
        <span>点击音量</span>
        <output id="volume-value" for="volume">40%</output>
      </label>
      <input id="volume" type="range" min="0" max="100" step="1" value="40" />
      <p id="status" role="status" aria-live="polite"></p>
      <footer>
        <button id="close" type="button">关闭</button>
        <button id="save" class="primary" type="button">保存</button>
      </footer>
    </main>
    <script type="module" src="./settings.ts"></script>
  </body>
</html>
